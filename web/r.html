<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>圆桌纪</title>
<script>
/* v0.41 起应用本体即站点根 index.html，邀请链接一律用「/#join=码」，不再产生 /r.html 链接。
 * 本文件保留仅为兼容此前已发出去的旧邀请链接（形如 /r.html#join=CODE）——旧链接点进来仍能直达。
 * 参数顺序修正为 search 在前、hash 在后（此前 hash 前置会把 ?query 折进 fragment）。 */
location.replace('./' + (location.search || '') + (location.hash || ''));
</script>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#FAF6EF;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:#26190D}
a{color:#F25C0C}
</style>
</head>
<body>
<p>正在进入… <a id="go" href="./">点此直达</a></p>
<script>document.getElementById('go').href = './' + (location.search || '') + (location.hash || '');</script>
</body>
</html>
